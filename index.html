<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ciudadanía VR - Inmersión Total</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            width: 100vw; height: 100vh; color: white; font-family: sans-serif; 
        }
        #vrWrapper { display: flex; width: 100vw; height: 100vh; cursor: pointer; }
        .vrEye { width: 50vw; height: 100vh; position: relative; overflow: hidden; }
        .cesiumContainer { width: 100%; height: 100%; }
        #btnIniciar {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; padding: 20px 40px; background-color: #0066cc; color: white;
            border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    
    <button id="btnIniciar">ENTRAR EN MODO VR</button>

    <div id="vrWrapper">
        <div class="vrEye"><div id="cesiumLeft" class="cesiumContainer"></div></div>
        <div class="vrEye"><div id="cesiumRight" class="cesiumContainer"></div></div>
    </div>

    <script>
        const config = {
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            skyBox: false, animation: false, timeline: false,
            fullscreenButton: false, homeButton: false, geocoder: false,
            baseLayerPicker: false, navigationHelpButton: false, sceneModePicker: false,
            requestRenderMode: false // Forzado a false para actualización en tiempo real fluida
        };

        const viewerL = new Cesium.Viewer('cesiumLeft', config);
        const viewerR = new Cesium.Viewer('cesiumRight', config);

        // Limpieza estricta de UI de Cesium
        [viewerL, viewerR].forEach(v => {
            v.scene.backgroundColor = Cesium.Color.BLACK;
            v.bottomContainer.style.display = 'none';
            v.scene.camera.frustum.near = 0.1; 
            v.scene.screenSpaceCameraController.enableRotate = false;
            v.scene.screenSpaceCameraController.enableZoom = false;
            v.scene.screenSpaceCameraController.enableTranslate = false;
            v.scene.screenSpaceCameraController.enableTilt = false;
        });

        // --- SISTEMA DE COORDENADAS ANCLADO (MUNDO FIJO) ---
        // Tu posición en el espacio es una constante absoluta. No te mueves, solo miras.
        const POSICION_FIJA_VR = new Cesium.Cartesian3(0, -18000000, 0); 
        
        // Orientación base e interpoladores del Giroscopio
        let gyroYaw = 0.0, gyroPitch = 0.0, gyroRoll = 0.0;
        let filtroGiro = { heading: 0, pitch: 0, roll: 0 };
        
        // Parámetros de compensación manual del mando (para rotar el escenario si se desea)
        let manualYaw = 0.0;
        let manualPitch = 0.0;

        const SEPARACION_OJOS_METROS = 40000.0; // Distancia inter-ocular cósmica para mantener el 3D estereoscópico
        let sensoresActivos = false;

        // --- RENDERIZADO CON ROTACIÓN DE CABEZA INDEPENDIENTE ---
        function renderScene() {
            // Combinamos la dirección del giroscopio + el ajuste del mando
            let totalHeading = gyroYaw + manualYaw;
            let totalPitch = gyroPitch + manualPitch;
            let totalRoll = gyroRoll;

            // Creamos la matriz de rotación pura de la mirada del usuario
            let hpr = new Cesium.HeadingPitchRoll(totalHeading, totalPitch, totalRoll);
            let rotMatrix = Cesium.Matrix3.fromHeadingPitchRoll(hpr);

            // Calculamos hacia dónde apunta la cara (Eje -Z local) y el "arriba" de la cabeza (Eje Y local)
            let dirAdelante = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 0, -1), new Cesium.Cartesian3());
            let dirArriba = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 1, 0), new Cesium.Cartesian3());
            let dirDerecha = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(1, 0, 0), new Cesium.Cartesian3());

            // Desplazamiento de cámaras laterales sin alterar la posición base del mundo
            let desplazarL = Cesium.Cartesian3.multiplyByScalar(dirDerecha, -SEPARACION_OJOS_METROS, new Cesium.Cartesian3());
            let desplazarR = Cesium.Cartesian3.multiplyByScalar(dirDerecha, SEPARACION_OJOS_METROS, new Cesium.Cartesian3());

            let posOjoL = Cesium.Cartesian3.add(POSICION_FIJA_VR, desplazarL, new Cesium.Cartesian3());
            let posOjoR = Cesium.Cartesian3.add(POSICION_FIJA_VR, desplazarR, new Cesium.Cartesian3());

            // Aplicamos la vista libre de la cámara. La Tierra y los paneles se quedarán quietos en sus coordenadas espaciales.
            viewerL.camera.setView({ destination: posOjoL, orientation: { direction: dirAdelante, up: dirArriba } });
            viewerR.camera.setView({ destination: posOjoR, orientation: { direction: dirAdelante, up: dirArriba } });
        }

        // --- BUCLE DE ANIMACIÓN NATIVO ---
        function buclePrincipal() {
            actualizarMando();
            renderScene();
            requestAnimationFrame(buclePrincipal);
        }

        // --- ACCIÓN DEL MANDO (Girar o Desplazar el escenario alternativamente) ---
        function actualizarMando() {
            const gamepads = navigator.getGamepads();
            let gp = null;
            for(let i=0; i<gamepads.length; i++) { if(gamepads[i]) { gp = gamepads[i]; break; } }
            
            if (gp) {
                const deadzone = 0.15;
                const aplicarDeadzone = (v) => Math.abs(v) > deadzone ? v : 0;

                const stickIzquierdoX = aplicarDeadzone(gp.axes[0]); 
                const stickIzquierdoY = aplicarDeadzone(gp.axes[1]); 

                // Si usas los sticks, alteras el ángulo manual para buscar los paneles sin girar el cuello físicamente
                if (stickIzquierdoX !== 0) {
                    manualYaw -= stickIzquierdoX * 0.03;
                }
                if (stickIzquierdoY !== 0) {
                    manualPitch += stickIzquierdoY * 0.02;
                }
            }
        }

        // --- CAPTURA PRECISA DEL GIROSCOPIO EN HORIZONTAL (PROCESADO FIJO) ---
        function procesarDatosSensores(e) {
            sensoresActivos = true;

            let alpha = e.alpha || 0; 
            let beta = e.beta || 0;   
            let gamma = e.gamma || 0; 

            let heading, pitch, roll;

            // Ajuste estricto para cuando el Redmi está bloqueado en Horizontal dentro del visor VR
            if (window.innerHeight < window.innerWidth) {
                heading = Cesium.Math.toRadians(alpha); 
                pitch = Cesium.Math.toRadians(-gamma);  
                roll = Cesium.Math.toRadians(beta - 90); 
            } else {
                heading = Cesium.Math.toRadians(alpha);
                pitch = Cesium.Math.toRadians(beta);
                roll = Cesium.Math.toRadians(gamma);
            }

            // Filtro de interpolación (Lerp) al 25% para suavizar el jitter mecánico del móvil
            filtroGiro.heading = Cesium.Math.lerp(filtroGiro.heading, heading, 0.25);
            filtroGiro.pitch = Cesium.Math.lerp(filtroGiro.pitch, pitch, 0.25);
            filtroGiro.roll = Cesium.Math.lerp(filtroGiro.roll, roll, 0.25);

            // Asignación de variables globales de giroscopio independientes
            gyroYaw = filtroGiro.heading;
            gyroPitch = filtroGiro.pitch;
            gyroRoll = filtroGiro.roll;
        }

        // --- INTERRUPTOR DE ARRANQUE INMERSIVO ---
        document.getElementById('btnIniciar').addEventListener('click', async () => {
            document.getElementById('btnIniciar').style.display = 'none';

            // Activar Pantalla completa y forzar Landscape nítido
            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) await docEl.requestFullscreen({ navigationUI: "hide" });
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape-primary");
            } catch (err) { console.log("Bloqueo de pantalla no soportado."); }

            // Activar Eventos de Sensores Absolutos (Ideales para Android/Chrome)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const respuesta = await DeviceOrientationEvent.requestPermission();
                    if (respuesta === 'granted') window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
                } catch (err) { console.error(err); }
            } else {
                if ('ondeviceorientationabsolute' in window) {
                    window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
                } else {
                    window.addEventListener('deviceorientation', procesarDatosSensores, true);
                }
            }

            // Inicializar el motor gráfico continuo
            buclePrincipal();
        });
    </script>
</body>
</html>
