<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience - Cesium + Organizaciones</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; width: 100vw; height: 100vh; color: white; font-family: 'Segoe UI', sans-serif; }
        
        /* Contenedor VR Pantalla Dividida (Fondo) */
        #vrWrapper { display: flex; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .vrEye { width: 50vw; height: 100vh; position: relative; overflow: hidden; }
        .cesiumContainer { width: 100%; height: 100%; }

        /* Capa de Interfaz de Usuario VR (Flotante en frente) */
        #uiWrapper { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            z-index: 10; pointer-events: none; display: flex; 
        }
        .uiEye { 
            width: 50vw; height: 100vh; position: relative; 
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            box-sizing: border-box; padding: 40px 60px;
        }

        /* Paneles de Contenido Estilo Holograma */
        .panels-container { display: flex; width: 100%; justify-content: space-between; margin-top: 20px; }
        .panel { 
            width: 45%; height: 60vh; background: rgba(6, 10, 22, 0.85); 
            border: 4px solid rgba(0, 123, 255, 0.8); border-radius: 12px; 
            padding: 20px; box-sizing: border-box; backdrop-filter: blur(4px);
            overflow: hidden;
        }
        .panel h2 { color: #00a2ff; margin-top: 0; font-size: 24px; border-bottom: 2px solid rgba(0, 123, 255, 0.4); padding-bottom: 10px; }
        .panel ul { list-style-type: none; padding: 0; margin: 0; }
        .panel li { font-size: 18px; margin-bottom: 12px; line-height: 1.4; }
        
        .right-content { text-align: center; }
        .org-logo { width: 90px; height: 90px; border-radius: 8px; margin-bottom: 10px; background: #fff; object-fit: contain;}
        .org-title { color: #00a2ff; font-size: 28px; font-weight: bold; margin: 5px 0; text-transform: uppercase; }

        /* Selector Inferior Central */
        .selector-panel { 
            background: rgba(10, 18, 36, 0.9); border: 3px solid #007bff; 
            border-radius: 8px; padding: 10px 40px; font-size: 26px; font-weight: bold;
            margin-bottom: 30px; text-align: center; min-width: 200px;
        }

        /* Retículas de apuntado VR */
        .v-reticle {
            position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; 
            background-color: rgba(255,255,255,0.8); border-radius: 50%; 
            transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 6px #00ffcc;
        }

        /* Botón de Permiso Inicial */
        #permission-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 40px; font-size: 20px; background-color: #007bff; color: white;
            border: none; border-radius: 8px; cursor: pointer; z-index: 30;
            box-shadow: 0px 6px 15px rgba(0,123,255,0.6); transition: all 0.3s;
        }
        #permission-btn:hover { background-color: #0056b3; transform: translate(-50%, -50%) scale(1.05); }
    </style>
</head>
<body>
    
    <button id="permission-btn">Iniciar Experiencia VR</button>

    <div id="vrWrapper">
        <div class="vrEye"><div id="cesiumLeft" class="cesiumContainer"></div></div>
        <div class="vrEye"><div id="cesiumRight" class="cesiumContainer"></div></div>
    </div>

    <div id="uiWrapper" style="display: none;">
        <div class="uiEye">
            <div class="v-reticle"></div>
            <div class="panels-container">
                <div class="panel"><h2 id="paisesTitleL">PAÍSES MIEMBROS</h2><ul id="paisesListL"></ul></div>
                <div class="panel right-content">
                    <img id="orgLogoL" class="org-logo" src="" alt="">
                    <div id="orgTitleL" class="org-title"></div>
                    <p id="orgInfoL" style="font-size: 18px; text-align: left; margin-top: 15px;"></p>
                </div>
            </div>
            <div id="selectorL" class="selector-panel"></div>
        </div>

        <div class="uiEye">
            <div class="v-reticle"></div>
            <div class="panels-container">
                <div class="panel"><h2 id="paisesTitleR">PAÍSES MIEMBROS</h2><ul id="paisesListR"></ul></div>
                <div class="panel right-content">
                    <img id="orgLogoR" class="org-logo" src="" alt="">
                    <div id="orgTitleR" class="org-title"></div>
                    <p id="orgInfoR" style="font-size: 18px; text-align: left; margin-top: 15px;"></p>
                </div>
            </div>
            <div id="selectorR" class="selector-panel"></div>
        </div>
    </div>

    <script>
        // ==================== DATOS DE ORGANIZACIONES ====================
        const orgData = { 
            "ACNUR": { anio: 1950, imagen: "logos/ACNUR.jpg",
                info: ["Misión: Proteger refugiados, desplazados y apátridas.","Brinda ayuda humanitaria: refugio, salud, agua y educación.","Opera en más de 130 países y ha asistido a más de 100 millones de personas."],
                paises: ["Afganistán","Albania","Alemania","Angola","Argelia","Argentina","Australia","Austria","Bangladesh","Bélgica","Brasil","Canadá","Chile","China","Colombia","Ecuador","España","Estados Unidos","Etiopía","Francia","India","Italia","Japón","Jordania","Kenya","México","Perú","Reino Unido","Rusia","Sudáfrica","Suiza","Turquía","Uganda","Yemen"]
            },
            "Banco Mundial": { anio: 1944, imagen: "logos/Banco Mundial.jpg",
                info: ["Financia proyectos de desarrollo en países de ingresos bajos y medios.","Enfocado en reducción de pobreza, infraestructura y cambio climático.","Ha ayudado a sacar a cientos de millones de personas de la pobreza extrema."],
                paises: ["Argentina","Bolivia","Brasil","Chile","Colombia","Ecuador","Estados Unidos","México","Perú","Uruguay","Venezuela","Reino Unido","Francia","Alemania","Japón","China","India","Indonesia","Nigeria","Sudáfrica","Etiopía","Kenya","Ghana","Bangladesh","Vietnam","Filipinas"]
            },
            "Cruz Roja": { anio: 1863, imagen: "logos/Cruz Roja.jpg",
                info: ["Movimiento humanitario neutral presente en casi todos los países.","Asiste en conflictos armados y desastres naturales.","Promueve el Derecho Internacional Humanitario."],
                paises: ["Suiza","Francia","Italia","España","Reino Unido","Alemania","Estados Unidos","Canadá","México","Colombia","Brasil","Argentina","Japón","China","Australia","Rusia","India","Turquía","Siria","Sudán","Nigeria","Sudáfrica","Pakistán","Irán"]
            },
            "UIT": { anio: 1865, imagen: "logos/UIT.jpg",
                info: ["Estándares de telecomunicaciones globales.","Gestión del espectro radioeléctrico.","Conectividad universal."],
                paises: ["Suiza","Francia","Estados Unidos","Reino Unido","Alemania","España","Italia","Rusia","China","Japón","India","Brasil","México","Argentina","Canadá","Australia","Indonesia","Nigeria","Sudáfrica","Egipto"]
            }
        };

        const orgKeys = Object.keys(orgData);
        let currentSelectedIndex = 0;
        let currentPaisPage = 0;
        let currentInfoPage = 0;
        const paisesPorPagina = 8; // Reducido ligeramente para encajar limpio en UI HTML de baja altura

        // --- CONFIGURACIÓN DE CESIUM ---
        const config = {
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            skyBox: false, animation: false, timeline: false,
            fullscreenButton: false, homeButton: false, geocoder: false,
            baseLayerPicker: false, navigationHelpButton: false, sceneModePicker: false,
            requestRenderMode: true
        };

        const viewerL = new Cesium.Viewer('cesiumLeft', config);
        const viewerR = new Cesium.Viewer('cesiumRight', config);

        [viewerL, viewerR].forEach(v => {
            v.scene.backgroundColor = Cesium.Color.BLACK;
            v.bottomContainer.style.display = 'none';
            v.scene.camera.frustum.near = 0.1;
            const sccc = v.scene.screenSpaceCameraController;
            sccc.enableRotate = sccc.enableZoom = sccc.enableTranslate = sccc.enableTilt = false;
        });

        let worldQuaternion = Cesium.Quaternion.IDENTITY.clone();
        let currentZoomDistance = 20000000;
        const RADIO_TIERRA = 6378137;

        function renderScene() {
            let matrix = Cesium.Matrix3.fromQuaternion(worldQuaternion);
            let dirBase = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(0, 0, -1), new Cesium.Cartesian3());
            let upBase = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(0, 1, 0), new Cesium.Cartesian3());

            let alturaActual = Math.max(1, currentZoomDistance - RADIO_TIERRA);
            let eyeSeparation = alturaActual * 0.008;

            let posL = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(-eyeSeparation, 0, currentZoomDistance), new Cesium.Cartesian3());
            viewerL.camera.setView({ destination: posL, orientation: { direction: dirBase, up: upBase } });

            let posR = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(eyeSeparation, 0, currentZoomDistance), new Cesium.Cartesian3());
            viewerR.camera.setView({ destination: posR, orientation: { direction: dirBase, up: upBase } });

            viewerL.scene.requestRender();
            viewerR.scene.requestRender();
        }
        renderScene();

        // ==================== RENDERIZADO DE INTERFAZ EN PANTALLA ====================
        function actualizarInterfazHTML() {
            const key = orgKeys[currentSelectedIndex];
            const data = orgData[key];
            if (!data) return;

            // Procesar Países por página
            const start = currentPaisPage * paisesPorPagina;
            const listaPaisesHTML = data.paises.slice(start, start + paisesPorPagina)
                                              .map(p => `<li>• ${p}</li>`).join('');

            // Inyectar en espejo para ambos ojos (Izquierdo y Derecho)
            document.getElementById('paisesListL').innerHTML = listaPaisesHTML;
            document.getElementById('paisesListR').innerHTML = listaPaisesHTML;

            // Actualizar Logos e Información general
            ['L', 'R'].forEach(eye => {
                document.getElementById(`orgLogo${eye}`).src = data.imagen;
                document.getElementById(`orgTitle${eye}`).innerText = key;
                document.getElementById(`orgInfo${eye}`).innerText = data.info[currentInfoPage];
                document.getElementById(`selector${eye}`).innerText = key;
            });
        }

        function scrollPaises(dir) {
            const total = Math.ceil(orgData[orgKeys[currentSelectedIndex]].paises.length / paisesPorPagina);
            currentPaisPage = (currentPaisPage + dir + total) % total;
            actualizarInterfazHTML();
        }

        function navegarOrganizaciones(dir) {
            currentSelectedIndex = (currentSelectedIndex + dir + orgKeys.length) % orgKeys.length;
            currentPaisPage = 0;
            currentInfoPage = 0;
            actualizarInterfazHTML();
        }

        // ==================== CONTROLADOR DE MANDOS (GAMEPAD) ====================
        let gamepadConnected = false;
        let buttonPressedState = { square: false, circle: false, dpadUp: false, dpadDown: false, dpadLeft: false, dpadRight: false };

        function loopMando() {
            const gamepads = navigator.getGamepads();
            let gp = null;
            for(let i=0; i<gamepads.length; i++) { if(gamepads[i]) { gp = gamepads[i]; break; } }
            
            if (gp) {
                gamepadConnected = true;
                const deadzone = 0.15;
                const aplicarDeadzone = (v) => Math.abs(v) > deadzone ? v : 0;

                // Rotación del Globo de Cesium con Joysticks análogos
                const rotX = aplicarDeadzone(gp.axes[0]);
                const rotY = aplicarDeadzone(gp.axes[1]);
                let alturaActual = Math.max(1, currentZoomDistance - RADIO_TIERRA);

                if (rotX !== 0 || rotY !== 0) {
                    let factorRotacion = Math.max(0.0001, alturaActual / 20000000) * 0.04;
                    let rotXQuat = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_Y, rotX * factorRotacion);
                    let rotYQuat = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X, rotY * factorRotacion);
                    
                    let tempQuat = Cesium.Quaternion.multiply(worldQuaternion, rotXQuat, new Cesium.Quaternion());
                    worldQuaternion = Cesium.Quaternion.multiply(tempQuat, rotYQuat, new Cesium.Quaternion());
                    Cesium.Quaternion.normalize(worldQuaternion, worldQuaternion);
                }

                // Zoom (Eje derecho)
                const zoomFactor = aplicarDeadzone(gp.axes[3]);
                if (zoomFactor !== 0) {
                    currentZoomDistance += zoomFactor * (alturaActual * 0.07);
                    if (currentZoomDistance < (RADIO_TIERRA + 0.5)) currentZoomDistance = RADIO_TIERRA + 0.5;
                }

                if (rotX !== 0 || rotY !== 0 || zoomFactor !== 0) { renderScene(); }

                // --- BOTONES Y CRUCETA (D-PAD) ---
                if (gp.buttons[12]?.pressed && !buttonPressedState.dpadUp) { buttonPressedState.dpadUp = true; scrollPaises(-1); }
                else if (!gp.buttons[12]?.pressed) buttonPressedState.dpadUp = false;

                if (gp.buttons[13]?.pressed && !buttonPressedState.dpadDown) { buttonPressedState.dpadDown = true; scrollPaises(1); }
                else if (!gp.buttons[13]?.pressed) buttonPressedState.dpadDown = false;

                if (gp.buttons[14]?.pressed && !buttonPressedState.dpadLeft) {
                    buttonPressedState.dpadLeft = true;
                    const t = orgData[orgKeys[currentSelectedIndex]].info.length;
                    currentInfoPage = (currentInfoPage - 1 + t) % t;
                    actualizarInterfazHTML();
                } else if (!gp.buttons[14]?.pressed) buttonPressedState.dpadLeft = false;

                if (gp.buttons[15]?.pressed && !buttonPressedState.dpadRight) {
                    buttonPressedState.dpadRight = true;
                    const t = orgData[orgKeys[currentSelectedIndex]].info.length;
                    currentInfoPage = (currentInfoPage + 1) % t;
                    actualizarInterfazHTML();
                } else if (!gp.buttons[15]?.pressed) buttonPressedState.dpadRight = false;

                // Cambios de Organización (Cuadrado / Círculo)
                if (gp.buttons[2]?.pressed && !buttonPressedState.square) { buttonPressedState.square = true; navegarOrganizaciones(-1); }
                else if (!gp.buttons[2]?.pressed) buttonPressedState.square = false;

                if (gp.buttons[1]?.pressed && !buttonPressedState.circle) { buttonPressedState.circle = true; navegarOrganizaciones(1); }
                else if (!gp.buttons[1]?.pressed) buttonPressedState.circle = false;
            }
            requestAnimationFrame(loopMando);
        }
        window.addEventListener("gamepadconnected", () => { requestAnimationFrame(loopMando); });

        // ==================== DISPARADOR DE PANTALLA VR ====================
        actualizarInterfazHTML();

        document.getElementById('permission-btn').addEventListener('click', async () => {
            try {
                document.getElementById('permission-btn').style.display = 'none';
                document.getElementById('uiWrapper').style.display = 'flex'; // Mostrar interfaz

                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen({ navigationUI: "hide" });
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen({ navigationUI: "hide" });
                }

                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock("landscape-primary").catch(err => console.log("Bloqueo de rotación ignorado"));
                }
            } catch (error) {
                console.log("Error al iniciar pantalla completa:", error);
            }
        });
    </script>
</body>
</html>
