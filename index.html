<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Tierra VR - Espacio Libre Absoluto</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            width: 100vw; height: 100vh; color: white; font-family: sans-serif; 
        }
        #vrWrapper { display: flex; width: 100vw; height: 100vh; cursor: pointer; }
        .vrEye { width: 50vw; height: 100vh; position: relative; overflow: hidden; }
        .cesiumContainer { width: 100%; height: 100%; }
        #btnIniciar {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; padding: 20px 40px; background-color: #0066cc; color: white;
            border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    
    <button id="btnIniciar">ENTRAR EN ESPACIO LIBRE VR</button>

    <div id="vrWrapper">
        <div class="vrEye"><div id="cesiumLeft" class="cesiumContainer"></div></div>
        <div class="vrEye"><div id="cesiumRight" class="cesiumContainer"></div></div>
    </div>

    <script>
        const config = {
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            skyBox: false, animation: false, timeline: false,
            fullscreenButton: false, homeButton: false, geocoder: false,
            baseLayerPicker: false, navigationHelpButton: false, sceneModePicker: false,
            requestRenderMode: false // Renderizado nativo continuo a 60 FPS sin pausas
        };

        const viewerL = new Cesium.Viewer('cesiumLeft', config);
        const viewerR = new Cesium.Viewer('cesiumRight', config);

        [viewerL, viewerR].forEach(v => {
            v.scene.backgroundColor = Cesium.Color.BLACK;
            v.bottomContainer.style.display = 'none';
            v.scene.camera.frustum.near = 10.0; 
            const sccc = v.scene.screenSpaceCameraController;
            sccc.enableRotate = sccc.enableZoom = sccc.enableTranslate = sccc.enableTilt = false;
        });

        // --- SISTEMA DE POSICIONAMIENTO EN ESPACIO LIBRE ---
        // Iniciamos en el espacio (X=0, Y=-20000000 metros, Z=0) mirando hacia el centro de la Tierra
        let posicionNave = new Cesium.Cartesian3(0, -20000000, 0);
        
        // Ángulos de la mirada del jugador (Cabeza) independientes del mundo
        let yaw = 0.0;   // Mirar Izquierda / Derecha
        let pitch = 0.0; // Mirar Arriba / Abajo
        let roll = 0.0;  // Inclinación de la cabeza

        // Ángulos agregados por el giroscopio físico
        let gyroYaw = 0.0, gyroPitch = 0.0, gyroRoll = 0.0;

        const IPD_DISTANCIA = 30000.0; // Separación de ojos a escala cósmica para notar el 3D del planeta
        let sensoresActivos = false;

        // --- CALCULO VECTORIAL DE DIRECCIÓN DE CÁMARA ---
        function renderScene() {
            // Combinamos los ángulos manuales del mando con los del giroscopio
            let totalYaw = yaw + gyroYaw;
            let totalPitch = pitch + gyroPitch;
            let totalRoll = roll + gyroRoll;

            // Creamos una matriz de rotación local pura (Estilo simulación espacial de cabina)
            let hpr = new Cesium.HeadingPitchRoll(totalYaw, totalPitch, totalRoll);
            let rotMatrix = Cesium.Matrix3.fromHeadingPitchRoll(hpr);

            // Generamos los tres vectores directores locales de la cabeza del jugador
            let dirAdelante = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 0, -1), new Cesium.Cartesian3());
            let dirArriba = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 1, 0), new Cesium.Cartesian3());
            let dirDerecha = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(1, 0, 0), new Cesium.Cartesian3());

            // Separación de los ojos izquierdo y derecho desplazados lateralmente en su propio eje local
            let desplazarIzquierda = Cesium.Cartesian3.multiplyByScalar(dirDerecha, -IPD_DISTANCIA, new Cesium.Cartesian3());
            let desplazarDerecha = Cesium.Cartesian3.multiplyByScalar(dirDerecha, IPD_DISTANCIA, new Cesium.Cartesian3());

            let posOjoIzquierdo = Cesium.Cartesian3.add(posicionNave, desplazarIzquierda, new Cesium.Cartesian3());
            let posOjoDerecho = Cesium.Cartesian3.add(posicionNave, desplazarDerecha, new Cesium.Cartesian3());

            // Asignamos las vistas libres. Ahora si miras a otro lado, la Tierra desaparece de la pantalla
            viewerL.camera.setView({ destination: posOjoIzquierdo, orientation: { direction: dirAdelante, up: dirArriba } });
            viewerR.camera.setView({ destination: posOjoDerecho, orientation: { direction: dirAdelante, up: dirArriba } });
        }

        // --- BUCLE PRINCIPAL DE JUEGO ---
        function buclePrincipal() {
            actualizarMando();
            renderScene();
            requestAnimationFrame(buclePrincipal);
        }

        // --- TRASLACIÓN NATIVA CON MANDO ---
        function actualizarMando() {
            const gamepads = navigator.getGamepads();
            let gp = null;
            for(let i=0; i<gamepads.length; i++) { if(gamepads[i]) { gp = gamepads[i]; break; } }
            
            if (gp) {
                const deadzone = 0.15;
                const aplicarDeadzone = (v) => Math.abs(v) > deadzone ? v : 0;

                // Captura de sticks
                const stickIzquierdoX = aplicarDeadzone(gp.axes[0]); 
                const stickIzquierdoY = aplicarDeadzone(gp.axes[1]); 
                const stickDerechoY = aplicarDeadzone(gp.axes[3]);   
                const stickDerechoX = aplicarDeadzone(gp.axes[2]);   

                // Calcular velocidad dinámica según la distancia al centro de la Tierra
                let distanciaAlCentro = Cesium.Cartesian3.magnitude(posicionNave);
                let velocidadBase = Math.max(500, (distanciaAlCentro - 6378137) * 0.06);

                // Volvemos a calcular los vectores directores actuales para la traslación
                let hpr = new Cesium.HeadingPitchRoll(yaw + gyroYaw, pitch + gyroPitch, roll + gyroRoll);
                let rotMatrix = Cesium.Matrix3.fromHeadingPitchRoll(hpr);
                
                let dirAdelante = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 0, -1), new Cesium.Cartesian3());
                let dirDerecha = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(1, 0, 0), new Cesium.Cartesian3());
                let dirArriba = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 1, 0), new Cesium.Cartesian3());

                // Moverse adelante/atrás (Stick Izquierdo Vertical)
                if (stickIzquierdoY !== 0) {
                    let avance = Cesium.Cartesian3.multiplyByScalar(dirAdelante, -stickIzquierdoY * velocidadBase, new Cesium.Cartesian3());
                    posicionNave = Cesium.Cartesian3.add(posicionNave, avance, posicionNave);
                }
                // Moverse lateralmente (Stick Izquierdo Horizontal)
                if (stickIzquierdoX !== 0) {
                    let lateral = Cesium.Cartesian3.multiplyByScalar(dirDerecha, stickIzquierdoX * velocidadBase, new Cesium.Cartesian3());
                    posicionNave = Cesium.Cartesian3.add(posicionNave, lateral, posicionNave);
                }
                // Moverse arriba/abajo en el espacio (Stick Derecho Vertical)
                if (stickDerechoY !== 0) {
                    let vertical = Cesium.Cartesian3.multiplyByScalar(dirArriba, -stickDerechoY * velocidadBase, new Cesium.Cartesian3());
                    posicionNave = Cesium.Cartesian3.add(posicionNave, vertical, posicionNave);
                }
                // Rotación manual alternativa de la nave (Stick Derecho Horizontal)
                if (stickDerechoX !== 0) {
                    yaw -= stickDerechoX * 0.03;
                }
            }
        }

        // --- CAPTURA DE GIROSCOPIO PARA MIRADA LIBRE ---
        function procesarDatosSensores(e) {
            sensoresActivos = true;

            // Capturar datos nativos absolutos del giroscopio
            let alpha = e.alpha || 0; // Z
            let beta = e.beta || 0;   // X
            let gamma = e.gamma || 0; // Y

            // Mapeo adaptado milimétricamente para las gafas VR (Modo Landscape de lado)
            if (window.innerHeight < window.innerWidth) {
                // De lado, los ángulos cambian de posición física en el móvil
                gyroYaw = Cesium.Math.toRadians(alpha);
                gyroPitch = Cesium.Math.toRadians(-gamma);
                gyroRoll = Cesium.Math.toRadians(beta - 90);
            } else {
                gyroYaw = Cesium.Math.toRadians(alpha);
                gyroPitch = Cesium.Math.toRadians(beta);
                gyroRoll = Cesium.Math.toRadians(gamma);
            }
        }

        // --- DISPARADOR DE EVENTOS ---
        document.getElementById('btnIniciar').addEventListener('click', async () => {
            document.getElementById('btnIniciar').style.display = 'none';

            // Activar pantalla completa y bloquear rotación horizontal
            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) await docEl.requestFullscreen({ navigationUI: "hide" });
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape-primary");
            } catch (err) { console.log("Bloqueo de pantalla ignorado"); }

            // Permisos de sensores modernos
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const respuesta = await DeviceOrientationEvent.requestPermission();
                    if (respuesta === 'granted') window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
                } catch (err) { console.error(err); }
            } else {
                if ('ondeviceorientationabsolute' in window) {
                    window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
                } else {
                    window.addEventListener('deviceorientation', procesarDatosSensores, true);
                }
            }

            // Comprobación automática de bloqueo
            setTimeout(() => {
                if (!sensoresActivos) alert("El giroscopio está desactivado en la configuración de tu navegador. Actívalo en Ajustes > Configuración de sitios > Sensores.");
            }, 2000);

            // Arrancar simulación espacial
            buclePrincipal();
        });
    </script>
</body>
</html>
