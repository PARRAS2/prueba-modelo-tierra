<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Tierra VR Total - Inmersión Absoluta</title>
    <!-- Cargamos CesiumJS desde su CDN -->
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background-color: #000; 
            width: 100vw; 
            height: 100vh; 
            color: white; 
            font-family: sans-serif; 
        }
        #vrWrapper { 
            display: flex; 
            width: 100vw; 
            height: 100vh; 
            cursor: pointer; 
        }
        .vrEye { 
            width: 50vw; 
            height: 100vh; 
            position: relative; 
            overflow: hidden; 
        }
        .cesiumContainer { 
            width: 100%; 
            height: 100%; 
        }
        /* Botón de inicio llamativo y centrado para activar los sensores */
        #btnIniciar {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            padding: 20px 40px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            transition: background 0.3s;
        }
        #btnIniciar:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    
    <button id="btnIniciar">ENTRAR EN MODO VR</button>

    <div id="vrWrapper">
        <div class="vrEye"><div id="cesiumLeft" class="cesiumContainer"></div></div>
        <div class="vrEye"><div id="cesiumRight" class="cesiumContainer"></div></div>
    </div>

    <script>
        // Configuración óptima de Cesium para Realidad Virtual Móvil
        const config = {
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            skyBox: false, 
            animation: false, 
            timeline: false,
            fullscreenButton: false, 
            homeButton: false, 
            geocoder: false,
            baseLayerPicker: false, 
            navigationHelpButton: false, 
            sceneModePicker: false,
            requestRenderMode: false // Desactivado para forzar renderizado continuo y fluido a 60fps
        };

        const viewerL = new Cesium.Viewer('cesiumLeft', config);
        const viewerR = new Cesium.Viewer('cesiumRight', config);

        // Limpieza de interfaz de Cesium
        [viewerL, viewerR].forEach(v => {
            v.scene.backgroundColor = Cesium.Color.BLACK;
            v.bottomContainer.style.display = 'none';
            v.scene.camera.frustum.near = 0.1; 
            const sccc = v.scene.screenSpaceCameraController;
            // Desactivamos los controles táctiles por defecto para que no interfieran con el giroscopio
            sccc.enableRotate = sccc.enableZoom = sccc.enableTranslate = sccc.enableTilt = false;
        });

        // --- ESTADO MATRICIAL Y VARIABLES GLOBALES ---
        let worldQuaternion = Cesium.Quaternion.IDENTITY.clone();
        let gyroQuaternion = Cesium.Quaternion.IDENTITY.clone();
        let currentZoomDistance = 20000000; // Distancia inicial (Espacio)
        const RADIO_TIERRA = 6378137;
        let sensoresActivos = false;

        // --- RENDERIZADO ESTEREOSCÓPICO ---
        function renderScene() {
            // Combinar la rotación manual (mando) con la rotación física (giroscopio)
            let finalRotation = Cesium.Quaternion.multiply(worldQuaternion, gyroQuaternion, new Cesium.Quaternion());
            let matrix = Cesium.Matrix3.fromQuaternion(finalRotation);

            // Obtener vectores de dirección basados en la matriz resultante
            let dirBase = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(0, 0, -1), new Cesium.Cartesian3());
            let upBase = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(0, 1, 0), new Cesium.Cartesian3());

            let alturaActual = Math.max(1, currentZoomDistance - RADIO_TIERRA);
            // IPD Dinámico: ajusta la separación de ojos según la altura para evitar fatiga visual
            let eyeSeparation = Math.min(alturaActual * 0.007, 40000); 

            // Posicionamiento de Ojo Izquierdo
            let posL = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(-eyeSeparation, 0, currentZoomDistance), new Cesium.Cartesian3());
            viewerL.camera.setView({ destination: posL, orientation: { direction: dirBase, up: upBase } });

            // Posicionamiento de Ojo Derecho
            let posR = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(eyeSeparation, 0, currentZoomDistance), new Cesium.Cartesian3());
            viewerR.camera.setView({ destination: posR, orientation: { direction: dirBase, up: upBase } });
        }

        // --- BUCLE DE ANIMACIÓN UNIFICADO (Maximiza FPS) ---
        function buclePrincipal() {
            actualizarMando();
            renderScene();
            requestAnimationFrame(buclePrincipal);
        }

        // --- CAPTURA Y PROCESAMIENTO DE MANDO (GAMEPAD) ---
        function actualizarMando() {
            const gamepads = navigator.getGamepads();
            let gp = null;
            for(let i=0; i<gamepads.length; i++) { if(gamepads[i]) { gp = gamepads[i]; break; } }
            
            if (gp) {
                const deadzone = 0.15;
                const aplicarDeadzone = (v) => Math.abs(v) > deadzone ? v : 0;

                const rotX = aplicarDeadzone(gp.axes[0]); 
                const rotY = aplicarDeadzone(gp.axes[1]); 
                let alturaActual = Math.max(1, currentZoomDistance - RADIO_TIERRA);

                if (rotX !== 0 || rotY !== 0) {
                    let factorRotacion = Math.max(0.0001, alturaActual / 20000000) * 0.03;
                    let rotXQuat = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_Y, -rotX * factorRotacion);
                    let rotYQuat = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X, -rotY * factorRotacion);
                    
                    let tempQuat = Cesium.Quaternion.multiply(worldQuaternion, rotXQuat, new Cesium.Quaternion());
                    worldQuaternion = Cesium.Quaternion.multiply(tempQuat, rotYQuat, new Cesium.Quaternion());
                    Cesium.Quaternion.normalize(worldQuaternion, worldQuaternion);
                }

                const zoomFactor = aplicarDeadzone(gp.axes[3]); // Stick derecho vertical para Zoom
                if (zoomFactor !== 0) {
                    currentZoomDistance += zoomFactor * (alturaActual * 0.05);
                    if (currentZoomDistance < (RADIO_TIERRA + 50)) currentZoomDistance = RADIO_TIERRA + 50;
                }
            }
        }

        // --- CAPTURA DE GIROSCOPIO REMAPEADA PARA MÓVIL HORIZONTAL ---
        let filtroGiro = { heading: 0, pitch: 0, roll: 0 };

        function procesarDatosSensores(e) {
            sensoresActivos = true;

            let alpha = e.alpha || 0; 
            let beta = e.beta || 0;   
            let gamma = e.gamma || 0; 

            let heading, pitch, roll;

            // REMAPEADO DE EJES EN MODO HORIZONTAL (Landscape)
            if (window.innerHeight < window.innerWidth) {
                heading = Cesium.Math.toRadians(alpha); 
                pitch = Cesium.Math.toRadians(-gamma);  
                roll = Cesium.Math.toRadians(beta - 90); 
            } else {
                // Modo Vertical por defecto
                heading = Cesium.Math.toRadians(alpha);
                pitch = Cesium.Math.toRadians(beta);
                roll = Cesium.Math.toRadians(gamma);
            }

            // Filtro de atenuación (Lerp) al 20% para eliminar el ruido de los sensores del móvil
            filtroGiro.heading = Cesium.Math.lerp(filtroGiro.heading, heading, 0.2);
            filtroGiro.pitch = Cesium.Math.lerp(filtroGiro.pitch, pitch, 0.2);
            filtroGiro.roll = Cesium.Math.lerp(filtroGiro.roll, roll, 0.2);

            let hpr = new Cesium.HeadingPitchRoll(filtroGiro.heading, filtroGiro.pitch, filtroGiro.roll);
            gyroQuaternion = Cesium.Quaternion.fromHeadingPitchRoll(hpr, gyroQuaternion);
        }

        // --- DISPARADOR DE PERMISOS, PANTALLA COMPLETA Y SENSORES ---
        document.getElementById('btnIniciar').addEventListener('click', async () => {
            // Ocultar botón de inicio
            document.getElementById('btnIniciar').style.display = 'none';

            // 1. Forzar Pantalla Completa Avanzada e Inmersiva
            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen({ navigationUI: "hide" });
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen({ navigationUI: "hide" });
                }

                // 2. Bloquear la pantalla en Horizontal (Landscape) de forma nativa
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock("landscape-primary").catch(err => console.log("Bloqueo de rotación ignorado por el sistema"));
                }
            } catch (error) {
                console.log("Error al configurar pantalla completa u orientación:", error);
            }

            // 3. Inicializar los Sensores bajo protocolos de seguridad modernos
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                // Caso iOS / Safari modernos
                try {
                    const respuesta = await DeviceOrientationEvent.requestPermission();
                    if (respuesta === 'granted') {
                        window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
                    }
                } catch (err) {
                    console.error("Permiso de sensores denegado", err);
                }
            } else {
                // Caso Android / Chrome (Usa el evento absoluto si está disponible)
                if ('ondeviceorientationabsolute' in window) {
                    window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
                } else {
                    window.addEventListener('deviceorientation', procesarDatosSensores, true);
                }
            }

            // 4. Diagnóstico rápido tras 2 segundos si el giroscopio sigue bloqueado por el navegador
            setTimeout(() => {
                if (!sensoresActivos) {
                    alert("Aviso: No se reciben datos del giroscopio. Asegúrate de que tu navegador Chrome tenga habilitados los 'Sensores de movimiento' en la Configuración del Sitio.");
                }
            }, 2000);

            // 5. Encender el loop gráfico principal
            buclePrincipal();
        });
    </script>
</body>
</html>
