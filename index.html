<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Tierra VR - Producción GitHub</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.117/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.117/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background-color: #000; width: 100vw; height: 100vh; color: white; font-family: sans-serif; }
        #vrWrapper { display: flex; width: 100vw; height: 100vh; cursor: pointer; }
        .vrEye { width: 50vw; height: 100vh; position: relative; overflow: hidden; }
        .cesiumContainer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    
    <div id="vrWrapper">
        <div class="vrEye"><div id="cesiumLeft" class="cesiumContainer"></div></div>
        <div class="vrEye"><div id="cesiumRight" class="cesiumContainer"></div></div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE CAPAS GLOBALES (HTTPS SEGURO) ---
        // Servidor Satelital de Esri
        const crearSateliteProvider = () => {
            return new Cesium.UrlTemplateImageryProvider({
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                maximumLevel: 19
            });
        };

        // Servidor de Fronteras y Nombres Políticos de Esri
        const crearFronterasProvider = () => {
            return new Cesium.UrlTemplateImageryProvider({
                url: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
                maximumLevel: 19
            });
        };

        const configL = {
            imageryProvider: crearSateliteProvider(),
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            skyBox: false, skyAtmosphere: false, animation: false, timeline: false,
            fullscreenButton: false, homeButton: false, geocoder: false,
            baseLayerPicker: false, navigationHelpButton: false, sceneModePicker: false,
            requestRenderMode: true
        };

        const configR = {
            imageryProvider: crearSateliteProvider(),
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            skyBox: false, skyAtmosphere: false, animation: false, timeline: false,
            fullscreenButton: false, homeButton: false, geocoder: false,
            baseLayerPicker: false, navigationHelpButton: false, sceneModePicker: false,
            requestRenderMode: true
        };

        // Inicializamos visores independientes
        const viewerL = new Cesium.Viewer('cesiumLeft', configL);
        const viewerR = new Cesium.Viewer('cesiumRight', configR);

        // Superponemos las etiquetas y divisiones geográficas encima
        viewerL.imageryLayers.addImageryProvider(crearFronterasProvider());
        viewerR.imageryLayers.addImageryProvider(crearFronterasProvider());

        [viewerL, viewerR].forEach(v => {
            v.scene.backgroundColor = Cesium.Color.BLACK;
            v.bottomContainer.style.display = 'none';
            v.scene.camera.frustum.near = 0.1; 
            
            // Apagamos luces dinámicas y atmósfera para maximizar rendimiento en celulares
            v.scene.globe.enableLighting = false;
            v.scene.globe.showGroundAtmosphere = false;
            
            const sccc = v.scene.screenSpaceCameraController;
            sccc.enableRotate = sccc.enableZoom = sccc.enableTranslate = sccc.enableTilt = false;
        });

        // --- SISTEMA VR / MATRICIAL DE ORIENTACIÓN ---
        let worldQuaternion = Cesium.Quaternion.IDENTITY.clone();
        let gyroQuaternion = Cesium.Quaternion.IDENTITY.clone();
        let currentZoomDistance = 20000000; 
        const RADIO_TIERRA = 6378137;

        function renderScene() {
            let finalRotation = Cesium.Quaternion.multiply(worldQuaternion, gyroQuaternion, new Cesium.Quaternion());
            let matrix = Cesium.Matrix3.fromQuaternion(finalRotation);

            let dirBase = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(0, 0, -1), new Cesium.Cartesian3());
            let upBase = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(0, 1, 0), new Cesium.Cartesian3());

            let alturaActual = Math.max(1, currentZoomDistance - RADIO_TIERRA);
            let eyeSeparation = alturaActual * 0.008;

            let posL = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(-eyeSeparation, 0, currentZoomDistance), new Cesium.Cartesian3());
            viewerL.camera.setView({ destination: posL, orientation: { direction: dirBase, up: upBase } });

            let posR = Cesium.Matrix3.multiplyByVector(matrix, new Cesium.Cartesian3(eyeSeparation, 0, currentZoomDistance), new Cesium.Cartesian3());
            viewerR.camera.setView({ destination: posR, orientation: { direction: dirBase, up: upBase } });

            viewerL.scene.requestRender();
            viewerR.scene.requestRender();
        }
        
        setTimeout(renderScene, 500);

        // --- CONTROLES DE MANDO (GAMEPAD) ---
        let gamepadConnected = false;
        function loopMando() {
            const gamepads = navigator.getGamepads();
            let gp = null;
            for(let i=0; i<gamepads.length; i++) { if(gamepads[i]) { gp = gamepads[i]; break; } }
            
            if (gp) {
                gamepadConnected = true;
                const deadzone = 0.15;
                const aplicarDeadzone = (v) => Math.abs(v) > deadzone ? v : 0;

                const rotX = aplicarDeadzone(gp.axes[0]); 
                const rotY = aplicarDeadzone(gp.axes[1]); 
                let alturaActual = Math.max(1, currentZoomDistance - RADIO_TIERRA);

                if (rotX !== 0 || rotY !== 0) {
                    let factorRotacion = Math.max(0.0001, alturaActual / 20000000) * 0.04;
                    let rotXQuat = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_Y, rotX * factorRotacion);
                    let rotYQuat = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_X, rotY * factorRotacion);
                    
                    let tempQuat = Cesium.Quaternion.multiply(worldQuaternion, rotXQuat, new Cesium.Quaternion());
                    worldQuaternion = Cesium.Quaternion.multiply(tempQuat, rotYQuat, new Cesium.Quaternion());
                    Cesium.Quaternion.normalize(worldQuaternion, worldQuaternion);
                }

                const zoomFactor = aplicarDeadzone(gp.axes[3]);
                if (zoomFactor !== 0) {
                    currentZoomDistance += zoomFactor * (alturaActual * 0.07);
                    if (currentZoomDistance < (RADIO_TIERRA + 0.5)) currentZoomDistance = RADIO_TIERRA + 0.5;
                }

                if (rotX !== 0 || rotY !== 0 || zoomFactor !== 0) { renderScene(); }
            }
            requestAnimationFrame(loopMando);
        }
        window.addEventListener("gamepadconnected", () => { requestAnimationFrame(loopMando); });

        // --- GIROSCOPIO REMAPEADO ---
        let filtroGiro = { alpha: 0, beta: 0, gamma: 0 };

        function procesarDatosSensores(e) {
            let valAlpha = e.alpha;
            let valBeta = e.beta;
            let valGamma = e.gamma;

            if (valAlpha === null || valBeta === null || valGamma === null) return;

            filtroGiro.alpha = Cesium.Math.lerp(filtroGiro.alpha, valAlpha, 0.25);
            filtroGiro.beta = Cesium.Math.lerp(filtroGiro.beta, valBeta, 0.25);
            filtroGiro.gamma = Cesium.Math.lerp(filtroGiro.gamma, valGamma, 0.25);

            let a = Cesium.Math.toRadians(filtroGiro.alpha); 
            let b = Cesium.Math.toRadians(filtroGiro.beta);   
            let g = Cesium.Math.toRadians(filtroGiro.gamma); 

            let cX = Math.cos(b), sX = Math.sin(b);
            let cY = Math.cos(g), sY = Math.sin(g);
            let cZ = Math.cos(a), sZ = Math.sin(a);

            let m0 = cY * cZ + sX * sY * sZ;
            let m1 = cZ * sX * sY - cY * sZ;
            let m2 = cX * sY;
            let m3 = cX * sZ;
            let m4 = cX * cZ;
            let m5 = -sX;
            let m6 = cY * sX * sZ - cZ * sY;
            let m7 = sY * sZ + cY * cZ * sX;
            let m8 = cX * cY;

            let matrix3 = new Cesium.Matrix3(m0, m1, m2, m3, m4, m5, m6, m7, m8);
            gyroQuaternion = Cesium.Quaternion.fromRotationMatrix(matrix3, gyroQuaternion);

            renderScene();
        }

        window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
        window.addEventListener('deviceorientation', procesarDatosSensores, true);

        // --- ACTIVADOR DE PANTALLA COMPLETA TOTAL (FORZADO MEDIANTE HTTPS) ---
        document.getElementById('vrWrapper').addEventListener('click', async () => {
            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen({ navigationUI: "hide" });
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen({ navigationUI: "hide" });
                }

                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock("landscape-primary").catch(err => console.log("Bloqueo ignorado"));
                }
            } catch (error) {
                console.log("Error de fullscreen:", error);
            }
        });
    </script>
</body>
</html>
