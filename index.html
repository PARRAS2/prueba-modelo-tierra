<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>VR Earth Experience - Organizaciones Mundiales</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }
        #permission-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 40px; font-size: 20px; background-color: #007bff; color: white;
            border: none; border-radius: 8px; cursor: pointer; z-index: 30;
            box-shadow: 0px 6px 15px rgba(0,123,255,0.6);
            transition: all 0.3s;
        }
        #permission-btn:hover {
            background-color: #0056b3;
            transform: translate(-50%, -50%) scale(1.05);
        }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .v-reticle {
            position: absolute; top: 50%; width: 6px; height: 6px; background-color: rgba(255,255,255,0.8);
            border-radius: 50%; transform: translate(-50%, -50%); z-index: 20; display: none;
            pointer-events: none; box-shadow: 0 0 6px #00ffcc;
        }
        #reticle-left { left: 25%; }
        #reticle-right { left: 75%; }
        #reticle-pc {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            border: 2px solid #ffffff; border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 20; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/DeviceOrientationControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/effects/StereoEffect.js"></script>
</head>
<body>
    <button id="permission-btn">Iniciar Experiencia VR</button>
    <div id="canvas-container"></div>
    <div id="reticle-pc"></div>
    <div id="reticle-left" class="v-reticle"></div>
    <div id="reticle-right" class="v-reticle"></div>

    <script>
        // ==================== DATOS DE ORGANIZACIONES ====================
        const orgData = { 
            "ACNUR": { anio: 1950, imagen: "logos/ACNUR.jpg",
                info: ["Misión: Proteger refugiados, desplazados y apátridas.","Brinda ayuda humanitaria: refugio, salud, agua y educación.","Opera en más de 130 países y ha asistido a más de 100 millones de personas."],
                paises: ["Afganistán","Albania","Alemania","Angola","Argelia","Argentina","Australia","Austria","Bangladesh","Bélgica","Brasil","Canadá","Chile","China","Colombia","Ecuador","España","Estados Unidos","Etiopía","Francia","India","Italia","Japón","Jordania","Kenya","México","Perú","Reino Unido","Rusia","Sudáfrica","Suiza","Turquía","Uganda","Yemen"]
            },
            "Banco Mundial": { anio: 1944, imagen: "logos/Banco Mundial.jpg",
                info: ["Financia proyectos de desarrollo en países de ingresos bajos y medios.","Enfocado en reducción de pobreza, infraestructura y cambio climático.","Ha ayudado a sacar a cientos de millones de personas de la pobreza extrema."],
                paises: ["Argentina","Bolivia","Brasil","Chile","Colombia","Ecuador","Estados Unidos","México","Perú","Uruguay","Venezuela","Reino Unido","Francia","Alemania","Japón","China","India","Indonesia","Nigeria","Sudáfrica","Etiopía","Kenya","Ghana","Bangladesh","Vietnam","Filipinas"]
            },
            "Cruz Roja": { anio: 1863, imagen: "logos/Cruz Roja.jpg",
                info: ["Movimiento humanitario neutral presente en casi todos los países.","Asiste en conflictos armados y desastres naturales.","Promueve el Derecho Internacional Humanitario."],
                paises: ["Suiza","Francia","Italia","España","Reino Unido","Alemania","Estados Unidos","Canadá","México","Colombia","Brasil","Argentina","Japón","China","Australia","Rusia","India","Turquía","Siria","Sudán","Nigeria","Sudáfrica","Pakistán","Irán"]
            },
            "UIT": { anio: 1865, imagen: "logos/UIT.jpg",
                info: ["Estándares de telecomunicaciones globales.","Gestión del espectro radioeléctrico.","Conectividad universal."],
                paises: ["Suiza","Francia","Estados Unidos","Reino Unido","Alemania","España","Italia","Rusia","China","Japón","India","Brasil","México","Argentina","Canadá","Australia","Indonesia","Nigeria","Sudáfrica","Egipto"]
            }
        };

        const orgKeys = Object.keys(orgData);
        let currentSelectedIndex = 0;
        let currentPaisPage = 0;
        let currentInfoPage = 0;
        const paisesPorPagina = 12;

        let scene, camera, renderer, effect, vrControls, mouseControls;
        let earth, clouds, uiGroup, starGeometry, starParticles;
        let leftPanelMesh, rightPanelMesh, selectorPanelMesh;
        let leftCanvas, leftCtx, rightCanvas, rightCtx, selectorCanvas, selectorCtx;
        let leftTexture, rightTexture, selectorTexture;
        let isVR = false;
        let activeGamepad = null;

        // Limites de Zoom
        const ZOOM_MIN = 3.0;
        const ZOOM_MAX = 8.5;

        let buttonPressedState = {
            square: false, circle: false,
            dpadUp: false, dpadDown: false, dpadLeft: false, dpadRight: false
        };

        const canvasW = 2048, canvasH = 2048;
        const textureLoader = new THREE.TextureLoader();
        const loadedImages = {};

        // ==================== FUNCIONES ====================
        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5.6);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);

            // Luces estables
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(5, 3, 5);
            scene.add(dirLight);

            // Tierra y Nubes Avanzadas
            const geometry = new THREE.SphereGeometry(1.2, 64, 64);
            const earthTexture = textureLoader.load('textures/8k_earth_daymap.jpg');
            earth = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ map: earthTexture, shininess: 15 }));
            scene.add(earth);

            const cloudsGeo = new THREE.SphereGeometry(1.215, 64, 64);
            const cloudsTex = textureLoader.load('textures/8k_earth_clouds.jpg');
            clouds = new THREE.Mesh(cloudsGeo, new THREE.MeshPhongMaterial({ 
                alphaMap: cloudsTex, transparent: true, color: 0xffffff, depthWrite: false 
            }));
            scene.add(clouds);

            // SISTEMA DE PARTICULAS (Estrellas Espaciales)
            createStarfield();
            
            setupTextCanvases();
            createSpatialUI();

            mouseControls = new THREE.OrbitControls(camera, renderer.domElement);
            mouseControls.enableDamping = true;
            mouseControls.dampingFactor = 0.08;

            vrControls = new THREE.DeviceOrientationControls(camera);

            window.addEventListener("gamepadconnected", (e) => { activeGamepad = e.gamepad.index; });
            window.addEventListener("gamepaddisconnected", () => { activeGamepad = null; });
            window.addEventListener('resize', onWindowResize);

            preloadImagesAndRender();
            animate();
        }

        function createStarfield() {
            starGeometry = new THREE.BufferGeometry();
            const starCount = 1500;
            const starPositions = new Float32Array(starCount * 3);

            for(let i = 0; i < starCount * 3; i += 3) {
                // Posicionar partículas en una esfera gigante alrededor de la escena
                const radius = 50 + Math.random() * 30;
                const u = Math.random();
                const v = Math.random();
                const theta = u * 2.0 * Math.PI;
                const phi = Math.acos(2.0 * v - 1.0);
                
                starPositions[i] = radius * Math.sin(phi) * Math.cos(theta);
                starPositions[i+1] = radius * Math.sin(phi) * Math.sin(theta);
                starPositions[i+2] = radius * Math.cos(phi);
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            
            // Material brillante para las estrellas flotantes
            const starMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.25,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending
            });

            starParticles = new THREE.Points(starGeometry, starMaterial);
            scene.add(starParticles);
        }

        function setupTextCanvases() {
            leftCanvas = document.createElement('canvas'); leftCanvas.width = canvasW; leftCanvas.height = canvasH;
            leftCtx = leftCanvas.getContext('2d');
            leftTexture = new THREE.CanvasTexture(leftCanvas);

            rightCanvas = document.createElement('canvas'); rightCanvas.width = canvasW; rightCanvas.height = canvasH;
            rightCtx = rightCanvas.getContext('2d');
            rightTexture = new THREE.CanvasTexture(rightCanvas);

            selectorCanvas = document.createElement('canvas'); selectorCanvas.width = 1024; selectorCanvas.height = 240;
            selectorCtx = selectorCanvas.getContext('2d');
            selectorTexture = new THREE.CanvasTexture(selectorCanvas);
        }

        function createSpatialUI() {
            uiGroup = new THREE.Group();

            const panelGeo = new THREE.PlaneGeometry(3.6, 3.6);
            leftPanelMesh = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ map: leftTexture, transparent: true, side: THREE.DoubleSide }));
            leftPanelMesh.position.set(-4.0, 0.2, -0.8);
            leftPanelMesh.rotation.y = 0.46;
            uiGroup.add(leftPanelMesh);

            rightPanelMesh = new THREE.Mesh(panelGeo, new THREE.MeshBasicMaterial({ map: rightTexture, transparent: true, side: THREE.DoubleSide }));
            rightPanelMesh.position.set(4.0, 0.2, -0.8);
            rightPanelMesh.rotation.y = -0.46;
            uiGroup.add(rightPanelMesh);

            selectorPanelMesh = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.9), new THREE.MeshBasicMaterial({ map: selectorTexture, transparent: true, side: THREE.DoubleSide }));
            selectorPanelMesh.position.set(0, -2.2, -0.2);
            selectorPanelMesh.rotation.x = -0.3;
            uiGroup.add(selectorPanelMesh);

            scene.add(uiGroup);
        }

        function preloadImagesAndRender() {
            let loaded = 0;
            orgKeys.forEach(key => {
                const img = new Image();
                img.src = orgData[key].imagen;
                img.onload = () => {
                    loadedImages[key] = img;
                    loaded++;
                    if (loaded === orgKeys.length) renderUIElements(orgKeys[currentSelectedIndex]);
                };
            });
        }

        function wrapText(ctx, text, x, y, maxW, lineH) {
            let words = text.split(' '), line = '';
            for (let w of words) {
                let test = line + w + ' ';
                if (ctx.measureText(test).width > maxW && line.length > 0) {
                    ctx.fillText(line, x, y);
                    line = w + ' ';
                    y += lineH;
                } else line = test;
            }
            ctx.fillText(line, x, y);
        }

        function renderUIElements(key) {
            const data = orgData[key];
            if (!data) return;

            // Panel Izquierdo
            leftCtx.clearRect(0, 0, canvasW, canvasH);
            leftCtx.fillStyle = "rgba(6, 10, 22, 0.96)";
            leftCtx.fillRect(0, 0, canvasW, canvasH);
            leftCtx.strokeStyle = "rgba(0, 123, 255, 0.9)"; leftCtx.lineWidth = 26;
            leftCtx.strokeRect(0, 0, canvasW, canvasH);
            leftCtx.fillStyle = "#00a2ff"; leftCtx.font = "bold 130px 'Segoe UI'";
            leftCtx.fillText("PAÍSES MIEMBROS", 100, 180);

            const start = currentPaisPage * paisesPorPagina;
            leftCtx.fillStyle = "#ffffff"; leftCtx.font = "bold 95px 'Segoe UI'";
            let y = 420;
            data.paises.slice(start, start + paisesPorPagina).forEach(p => {
                leftCtx.fillText(`• ${p}`, 120, y);
                y += 135;
            });
            leftTexture.needsUpdate = true;

            // Panel Derecho
            rightCtx.clearRect(0, 0, canvasW, canvasH);
            rightCtx.fillStyle = "rgba(6, 10, 22, 0.96)";
            rightCtx.fillRect(0, 0, canvasW, canvasH);
            rightCtx.strokeStyle = "rgba(0, 123, 255, 0.9)"; rightCtx.lineWidth = 26;
            rightCtx.strokeRect(0, 0, canvasW, canvasH);

            if (loadedImages[key]) rightCtx.drawImage(loadedImages[key], 824, 80, 400, 400);

            rightCtx.fillStyle = "#00a2ff"; rightCtx.font = "bold 150px 'Segoe UI'";
            rightCtx.textAlign = "center";
            rightCtx.fillText(key.toUpperCase(), 1024, 560);

            rightCtx.strokeStyle = "rgba(0, 123, 255, 0.4)"; rightCtx.lineWidth = 10;
            rightCtx.beginPath(); rightCtx.moveTo(100, 710); rightCtx.lineTo(1948, 710); rightCtx.stroke();

            rightCtx.fillStyle = "#ffffff"; rightCtx.font = "95px 'Segoe UI'";
            rightCtx.textAlign = "left";
            wrapText(rightCtx, data.info[currentInfoPage], 100, 800, 1840, 135);
            rightTexture.needsUpdate = true;

            // Selector Inferior
            selectorCtx.clearRect(0, 0, 1024, 240);
            selectorCtx.fillStyle = "rgba(10, 18, 36, 0.96)";
            selectorCtx.fillRect(0, 0, 1024, 240);
            selectorCtx.strokeStyle = "#007bff"; selectorCtx.lineWidth = 12;
            selectorCtx.strokeRect(0, 0, 1024, 240);
            selectorCtx.fillStyle = "#ffffff"; selectorCtx.font = "bold 110px 'Segoe UI'";
            selectorCtx.textAlign = "center";
            selectorCtx.fillText(key, 512, 170);
            selectorTexture.needsUpdate = true;
        }

        function scrollPaises(dir) {
            const total = Math.ceil(orgData[orgKeys[currentSelectedIndex]].paises.length / paisesPorPagina);
            currentPaisPage = (currentPaisPage + dir + total) % total;
            renderUIElements(orgKeys[currentSelectedIndex]);
        }

        function navegarOrganizaciones(dir) {
            currentSelectedIndex = (currentSelectedIndex + dir + orgKeys.length) % orgKeys.length;
            currentPaisPage = 0;
            currentInfoPage = 0;
            renderUIElements(orgKeys[currentSelectedIndex]);
        }

        function handleGamepadInput() {
            if (activeGamepad === null) return;
            const gp = navigator.getGamepads()[activeGamepad];
            if (!gp) return;

            // Rotación del planeta con sticks analógicos
            const sx = gp.axes[0], sy = gp.axes[1];
            if (Math.abs(sx) > 0.15) {
                earth.rotation.y += sx * 0.03;
                clouds.rotation.y += sx * 0.03;
            }
            if (Math.abs(sy) > 0.15) {
                earth.rotation.x += sy * 0.03;
                clouds.rotation.x += sy * 0.03;
            }

            // === SISTEMA DINÁMICO DE ZOOM CON GATILLOS TRASEROS ===
            // Mapeo adaptado: L2 (Botón 6) aleja la vista, R2 (Botón 7) acerca la vista progresivamente
            if (gp.buttons[7] && gp.buttons[7].value > 0.05) { // R2 presionado
                camera.position.z -= gp.buttons[7].value * 0.08;
            }
            if (gp.buttons[6] && gp.buttons[6].value > 0.05) { // L2 presionado
                camera.position.z += gp.buttons[6].value * 0.08;
            }
            // Asegurar que el usuario no traspase los límites geométricos del espacio UI
            camera.position.z = THREE.MathUtils.clamp(camera.position.z, ZOOM_MIN, ZOOM_MAX);

            // D-Pad Controles de Menú
            if (gp.buttons[12]?.pressed && !buttonPressedState.dpadUp) { buttonPressedState.dpadUp = true; scrollPaises(-1); }
            else if (!gp.buttons[12]?.pressed) buttonPressedState.dpadUp = false;

            if (gp.buttons[13]?.pressed && !buttonPressedState.dpadDown) { buttonPressedState.dpadDown = true; scrollPaises(1); }
            else if (!gp.buttons[13]?.pressed) buttonPressedState.dpadDown = false;

            if (gp.buttons[14]?.pressed && !buttonPressedState.dpadLeft) {
                buttonPressedState.dpadLeft = true;
                const t = orgData[orgKeys[currentSelectedIndex]].info.length;
                currentInfoPage = (currentInfoPage - 1 + t) % t;
                renderUIElements(orgKeys[currentSelectedIndex]);
            } else if (!gp.buttons[14]?.pressed) buttonPressedState.dpadLeft = false;

            if (gp.buttons[15]?.pressed && !buttonPressedState.dpadRight) {
                buttonPressedState.dpadRight = true;
                const t = orgData[orgKeys[currentSelectedIndex]].info.length;
                currentInfoPage = (currentInfoPage + 1) % t;
                renderUIElements(orgKeys[currentSelectedIndex]);
            } else if (!gp.buttons[15]?.pressed) buttonPressedState.dpadRight = false;

            if (gp.buttons[2]?.pressed && !buttonPressedState.square) { 
                buttonPressedState.square = true;
                navegarOrganizaciones(-1);
            } else if (!gp.buttons[2]?.pressed) buttonPressedState.square = false;

            if (gp.buttons[1]?.pressed && !buttonPressedState.circle) { 
                buttonPressedState.circle = true;
                navegarOrganizaciones(1);
            } else if (!gp.buttons[1]?.pressed) buttonPressedState.circle = false;
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotación cósmica pasiva constante
            if (earth) {
                earth.rotation.y += 0.0002;
                clouds.rotation.y += 0.0004;
            }

            // Animación sutil de titileo estelar
            if (starParticles) {
                const time = Date.now() * 0.001;
                starParticles.geometry.attributes.position.needsUpdate = true;
                starParticles.rotation.y = time * 0.005; // Movimiento imperceptible del cielo
            }

            handleGamepadInput();

            if (isVR) {
                if (vrControls) vrControls.update();
                effect.render(scene, camera);
            } else {
                if (mouseControls) mouseControls.update();
                renderer.render(scene, camera);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== INICIO ====================
        init();

        document.getElementById('permission-btn').addEventListener('click', () => {
            document.getElementById('permission-btn').style.display = 'none';
            isVR = true;
            document.getElementById('reticle-pc').style.display = 'none';
            document.getElementById('reticle-left').style.display = 'block';
            document.getElementById('reticle-right').style.display = 'block';

            // Intentar forzar pantalla completa nativa
            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) docEl.requestFullscreen({ navigationUI: "hide" });
            } catch (e) { console.log(e); }
        });
    </script>
</body>
</html>
