<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Globo 3D de la Tierra - Selecciona País</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #cesiumContainer { width: 100vw; height: 100vh; }
        #panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        select {
            padding: 10px;
            font-size: 16px;
            width: 280px;
            border-radius: 6px;
        }
        h2 { margin: 0 0 10px 0; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <div id="panel">
        <h2>🌍 Selecciona un país</h2>
        <select id="countrySelect">
            <option value="">-- Elige un país --</option>
        </select>
    </div>

    <script>
        // === CONFIGURACIÓN BÁSICA ===
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ5cCI6IkpXVCJ9'; // Token público de Cesium (funciona para pruebas)

        const viewer = new Cesium.Viewer('cesiumContainer', {
            terrain: Cesium.Terrain.fromWorldTerrain(),
            skyBox: true,
            animation: false,
            timeline: false,
            fullscreenButton: true,
            geocoder: true
        });

        // Lista de países con bounding boxes (puedes ampliarla)
        const countries = {
            "Argentina": [-73.5, -55.2, -53.6, -21.8],
            "Bolivia": [-69.6, -22.9, -57.5, -9.7],
            "Brasil": [-73.9, -33.8, -34.8, 5.3],
            "Chile": [-75.6, -55.9, -66.4, -17.5],
            "Colombia": [-79.0, -4.2, -66.9, 12.4],
            "Ecuador": [-81.0, -5.0, -75.2, 1.4],
            "México": [-118.4, 14.5, -86.7, 32.7],
            "Perú": [-81.3, -18.3, -68.7, -0.0],
            "España": [-9.3, 36.0, 3.3, 43.8],
            "Estados Unidos": [-125.0, 24.4, -66.9, 49.4],
            "Francia": [-5.1, 42.3, 9.6, 51.1],
            "Italia": [6.6, 36.6, 18.5, 47.1],
            "Japón": [129.3, 31.0, 145.8, 45.5],
            "China": [73.5, 18.2, 134.1, 53.6],
            "India": [68.1, 6.8, 97.4, 37.0]
            // Agrega más países aquí
        };

        // Llenar el select
        const select = document.getElementById('countrySelect');
        Object.keys(countries).sort().forEach(country => {
            const option = document.createElement('option');
            option.value = country;
            option.textContent = country;
            select.appendChild(option);
        });

        // Evento al cambiar país
        select.addEventListener('change', function() {
            const countryName = this.value;
            if (!countryName) return;

            const bbox = countries[countryName]; // [west, south, east, north]
            
            viewer.camera.flyTo({
                destination: Cesium.Rectangle.fromDegrees(
                    bbox[0], bbox[1], bbox[2], bbox[3]
                ),
                duration: 2.5,           // segundos
                maximumHeight: 8000000   // altura máxima durante el vuelo
            });
        });

        // Vista inicial
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(-50, 20, 15000000),
            orientation: {
                heading: Cesium.Math.toRadians(0),
                pitch: Cesium.Math.toRadians(-70)
            }
        });
    </script>
</body>
</html>
