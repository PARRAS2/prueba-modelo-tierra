<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Tierra VR Total - Espacio Libre 3D</title>
    <script src="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Cesium.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/cesium@1.141/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    
    <style>
        body, html { 
            margin: 0; padding: 0; overflow: hidden; background-color: #000; 
            width: 100vw; height: 100vh; color: white; font-family: sans-serif; 
        }
        #vrWrapper { display: flex; width: 100vw; height: 100vh; cursor: pointer; }
        .vrEye { width: 50vw; height: 100vh; position: relative; overflow: hidden; }
        .cesiumContainer { width: 100%; height: 100%; }
        #btnIniciar {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 9999; padding: 20px 40px; background-color: #0066cc; color: white;
            border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    
    <button id="btnIniciar">ENTRAR EN MODO CABINA VR</button>

    <div id="vrWrapper">
        <div class="vrEye"><div id="cesiumLeft" class="cesiumContainer"></div></div>
        <div class="vrEye"><div id="cesiumRight" class="cesiumContainer"></div></div>
    </div>

    <script>
        const config = {
            terrainProvider: new Cesium.EllipsoidTerrainProvider(),
            skyBox: false, animation: false, timeline: false,
            fullscreenButton: false, homeButton: false, geocoder: false,
            baseLayerPicker: false, navigationHelpButton: false, sceneModePicker: false,
            requestRenderMode: false // Renderizado fluido continuo a 60 FPS
        };

        const viewerL = new Cesium.Viewer('cesiumLeft', config);
        const viewerR = new Cesium.Viewer('cesiumRight', config);

        [viewerL, viewerR].forEach(v => {
            v.scene.backgroundColor = Cesium.Color.BLACK;
            v.bottomContainer.style.display = 'none';
            v.scene.camera.frustum.near = 1.0; // Evita parpadeos de clipping a corta distancia
            const sccc = v.scene.screenSpaceCameraController;
            sccc.enableRotate = sccc.enableZoom = sccc.enableTranslate = sccc.enableTilt = false;
        });

        // --- SISTEMA DE COORDENADAS DE CABINA (Navegación Libre) ---
        // Empezamos en el espacio, mirando hacia el centro de la tierra (0,0,0)
        let camPosition = new Cesium.Cartesian3(0, 0, 20000000); 
        
        // Orientación base del jugador en el espacio (Matriz de rotación de la cabeza)
        let headQuaternion = Cesium.Quaternion.IDENTITY.clone();
        let gyroQuaternion = Cesium.Quaternion.IDENTITY.clone();
        
        const SEPARACION_OJOS = 65.0; // Distancia interpupilar física real en metros (IPD) para escala 1:1 en el espacio
        let sensoresActivos = false;

        // --- RENDERIZADO EN PRIMERA PERSONA (Estereoscópico Libre) ---
        function renderScene() {
            // Combinamos giroscopio (cabeza) y mando si aplica rotación
            let finalRotation = Cesium.Quaternion.multiply(headQuaternion, gyroQuaternion, new Cesium.Quaternion());
            let rotMatrix = Cesium.Matrix3.fromQuaternion(finalRotation);

            // Extraemos las direcciones locales relativas a los ojos del jugador
            let localDir = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 0, -1), new Cesium.Cartesian3()); // Hacia adelante
            let localUp = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 1, 0), new Cesium.Cartesian3());  // Hacia arriba
            let localRight = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(1, 0, 0), new Cesium.Cartesian3()); // Lateral derecho

            // Calcular el desplazamiento lateral de los ojos basado en la posición actual de la cámara
            let ojoIzquierdoDesplazamiento = Cesium.Cartesian3.multiplyByScalar(localRight, -SEPARACION_OJOS, new Cesium.Cartesian3());
            let ojoDerechoDesplazamiento = Cesium.Cartesian3.multiplyByScalar(localRight, SEPARACION_OJOS, new Cesium.Cartesian3());

            let posL = Cesium.Cartesian3.add(camPosition, ojoIzquierdoDesplazamiento, new Cesium.Cartesian3());
            let posR = Cesium.Cartesian3.add(camPosition, ojoDerechoDesplazamiento, new Cesium.Cartesian3());

            // Forzamos a que las dos cámaras miren libremente hacia donde apunta la cabeza
            viewerL.camera.setView({ destination: posL, orientation: { direction: localDir, up: localUp } });
            viewerR.camera.setView({ destination: posR, orientation: { direction: localDir, up: localUp } });
        }

        // --- BUCLE DE ACTUALIZACIÓN ---
        function buclePrincipal() {
            actualizarMando();
            renderScene();
            requestAnimationFrame(buclePrincipal);
        }

        // --- EL MANDO AHORA SE ENCARGA DEL DESPLAZAMIENTO 3D ---
        function actualizarMando() {
            const gamepads = navigator.getGamepads();
            let gp = null;
            for(let i=0; i<gamepads.length; i++) { if(gamepads[i]) { gp = gamepads[i]; break; } }
            
            if (gp) {
                const deadzone = 0.15;
                const aplicarDeadzone = (v) => Math.abs(v) > deadzone ? v : 0;

                // Mandos analógicos de desplazamiento
                const strafeX = aplicarDeadzone(gp.axes[0]); // Stick Izquierdo Horizontal (Moverse de lado)
                const moveZ = aplicarDeadzone(gp.axes[1]);   // Stick Izquierdo Vertical (Avanzar / Retroceder)
                const moveY = aplicarDeadzone(gp.axes[3]);   // Stick Derecho Vertical (Subir / Bajar altitud)

                // Dinamismo de velocidad: Nos movemos más rápido si estamos muy lejos del suelo
                let distanciaAlCentro = Cesium.Cartesian3.magnitude(camPosition);
                let velocidadBase = Math.max(100, (distanciaAlCentro - 6378137) * 0.05);

                // Obtener los vectores direccionales actuales para saber hacia dónde movernos
                let finalRotation = Cesium.Quaternion.multiply(headQuaternion, gyroQuaternion, new Cesium.Quaternion());
                let rotMatrix = Cesium.Matrix3.fromQuaternion(finalRotation);
                
                let dirAdelante = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 0, -1), new Cesium.Cartesian3());
                let dirDerecha = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(1, 0, 0), new Cesium.Cartesian3());
                let dirArriba = Cesium.Matrix3.multiplyByVector(rotMatrix, new Cesium.Cartesian3(0, 1, 0), new Cesium.Cartesian3());

                // Calcular vectores de movimiento finales
                if (moveZ !== 0) {
                    let avance = Cesium.Cartesian3.multiplyByScalar(dirAdelante, -moveZ * velocidadBase, new Cesium.Cartesian3());
                    camPosition = Cesium.Cartesian3.add(camPosition, avance, camPosition);
                }
                if (strafeX !== 0) {
                    let lateral = Cesium.Cartesian3.multiplyByScalar(dirDerecha, strafeX * velocidadBase, new Cesium.Cartesian3());
                    camPosition = Cesium.Cartesian3.add(camPosition, lateral, camPosition);
                }
                if (moveY !== 0) {
                    let vertical = Cesium.Cartesian3.multiplyByScalar(dirArriba, -moveY * velocidadBase, new Cesium.Cartesian3());
                    camPosition = Cesium.Cartesian3.add(camPosition, vertical, camPosition);
                }

                // Rotación manual auxiliar con el Stick Derecho Horizontal si existiese (Giro de nave)
                const rotManualX = aplicarDeadzone(gp.axes[2]);
                if (rotManualX !== 0) {
                    let qRot = Cesium.Quaternion.fromAxisAngle(Cesium.Cartesian3.UNIT_Y, -rotManualX * 0.02);
                    headQuaternion = Cesium.Quaternion.multiply(headQuaternion, qRot, headQuaternion);
                    Cesium.Quaternion.normalize(headQuaternion, headQuaternion);
                }
            }
        }

        // --- LECTURA ABSOLUTA DE LA ORIENTACIÓN DE LA CABEZA ---
        let filtroGiro = { heading: 0, pitch: 0, roll: 0 };

        function procesarDatosSensores(e) {
            sensoresActivos = true;

            let alpha = e.alpha || 0; 
            let beta = e.beta || 0;   
            let gamma = e.gamma || 0; 

            let heading, pitch, roll;

            // Mapeo adaptado exclusivamente al modo Landscape de las gafas VR
            if (window.innerHeight < window.innerWidth) {
                heading = Cesium.Math.toRadians(alpha); 
                pitch = Cesium.Math.toRadians(-gamma);  
                roll = Cesium.Math.toRadians(beta - 90); 
            } else {
                heading = Cesium.Math.toRadians(alpha);
                pitch = Cesium.Math.toRadians(beta);
                roll = Cesium.Math.toRadians(gamma);
            }

            // Suavizado dinámico suave para VR
            filtroGiro.heading = Cesium.Math.lerp(filtroGiro.heading, heading, 0.25);
            filtroGiro.pitch = Cesium.Math.lerp(filtroGiro.pitch, pitch, 0.25);
            filtroGiro.roll = Cesium.Math.lerp(filtroGiro.roll, roll, 0.25);

            let hpr = new Cesium.HeadingPitchRoll(filtroGiro.heading, filtroGiro.pitch, filtroGiro.roll);
            gyroQuaternion = Cesium.Quaternion.fromHeadingPitchRoll(hpr, gyroQuaternion);
        }

        // --- DISPARADOR ---
        document.getElementById('btnIniciar').addEventListener('click', async () => {
            document.getElementById('btnIniciar').style.display = 'none';

            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) await docEl.requestFullscreen({ navigationUI: "hide" });
                if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape-primary");
            } catch (e) { console.log(e); }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const respuesta = await DeviceOrientationEvent.requestPermission();
                    if (respuesta === 'granted') window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
                } catch (err) { console.error(err); }
            } else {
                if ('ondeviceorientationabsolute' in window) {
                    window.addEventListener('deviceorientationabsolute', procesarDatosSensores, true);
                } else {
                    window.addEventListener('deviceorientation', procesarDatosSensores, true);
                }
            }

            setTimeout(() => {
                if (!sensoresActivos) alert("Habilita los sensores de movimiento en la configuración de Chrome para interactuar.");
            }, 2000);

            buclePrincipal();
        });
    </script>
</body>
</html>
